<svg width="800" height="470" viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="470" fill="url(#bg)" />
  
  <!-- Decorative Blocks -->
  <rect x="50" y="50" width="80" height="80" rx="15" fill="#4DCCE6" opacity="0.6" transform="rotate(15, 90, 90)" />
  <circle cx="700" cy="100" r="60" fill="#F471B3" opacity="0.5" />
  <path d="M 100 400 L 150 320 L 200 400 Z" fill="#C8F471" opacity="0.4" />
  <rect x="650" y="350" width="100" height="100" rx="20" fill="#FFD93D" opacity="0.3" transform="rotate(-10, 700, 400)" />
  
  <!-- Text -->
  <g filter="url(#glow)">
    <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="72" fill="#4DCCE6" style="text-transform: uppercase; letter-spacing: -2px;">POP BLOCK</text>
    <text x="400" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="84" fill="#C8F471" style="text-transform: uppercase; letter-spacing: 5px;">BLITZ</text>
  </g>
  
  <!-- Accents -->
  <circle cx="400" cy="235" r="220" fill="none" stroke="white" stroke-width="1" opacity="0.1" />
</svg>