<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0F172A"/>
  
  <!-- Subtle Gradient background -->
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#grad1)"/>

  <!-- Game Title & Logo -->
  <g transform="translate(640, 60)">
    <text text-anchor="middle" fill="white" font-family="sans-serif" font-size="42" font-weight="900" style="letter-spacing: 2px;">POP BLOCK <tspan fill="#4DCCE6">BLITZ</tspan></text>
  </g>

  <!-- Side Stats - Left -->
  <rect x="50" y="200" width="240" height="100" rx="15" fill="#1E293B" stroke="#C8F471" stroke-width="2" stroke-opacity="0.5"/>
  <text x="70" y="235" fill="#94A3B8" font-family="sans-serif" font-size="16" font-weight="bold">BEST SCORE</text>
  <text x="70" y="280" fill="white" font-family="sans-serif" font-size="42" font-weight="900">45,800</text>

  <!-- Side Stats - Right -->
  <rect x="990" y="200" width="240" height="100" rx="15" fill="#1E293B" stroke="#4DCCE6" stroke-width="2" stroke-opacity="0.5"/>
  <text x="1010" y="235" fill="#94A3B8" font-family="sans-serif" font-size="16" font-weight="bold">CURRENT SCORE</text>
  <text x="1010" y="280" fill="white" font-family="sans-serif" font-size="42" font-weight="900">12,450</text>

  <!-- Game Board Simulation -->
  <rect x="340" y="120" width="600" height="560" rx="20" fill="#1E293B" fill-opacity="0.8" stroke="white" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Grid Simulation -->
  <g transform="translate(360, 140)">
    <!-- Simulated Blocks -->
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#4DCCE6"/>
    <rect x="55" y="0" width="50" height="50" rx="6" fill="#C8F471"/>
    <rect x="110" y="0" width="50" height="50" rx="6" fill="#F471B3"/>
    <rect x="165" y="0" width="50" height="50" rx="6" fill="#4DCCE6"/>
    <rect x="220" y="0" width="50" height="50" rx="6" fill="#F4A261"/>
    
    <!-- A group that was just "popped" -->
    <rect x="0" y="55" width="50" height="50" rx="6" fill="#C8F471" stroke="white" stroke-width="3" />
    <rect x="55" y="55" width="50" height="50" rx="6" fill="#C8F471" stroke="white" stroke-width="3" />
    <rect x="55" y="110" width="50" height="50" rx="6" fill="#C8F471" stroke="white" stroke-width="3" />
    
    <!-- Floating Points Effect -->
    <text x="60" y="200" fill="white" font-family="sans-serif" font-size="64" font-weight="900" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));">+240</text>
  </g>

  <!-- AI Performance Badge -->
  <rect x="520" y="620" width="240" height="50" rx="25" fill="#4DCCE6" />
  <text x="640" y="652" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">ADAPTIVE AI CHALLENGE</text>

  <!-- Decorative Particle effects -->
  <circle cx="400" cy="400" r="4" fill="#4DCCE6" fill-opacity="0.6"/>
  <circle cx="850" cy="500" r="6" fill="#C8F471" fill-opacity="0.4"/>
  <circle cx="700" cy="250" r="3" fill="#F471B3" fill-opacity="0.5"/>
</svg>