<svg width="800" height="470" viewBox="0 0 800 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="470" fill="#F3F6F6"/>
  
  <!-- Abstract Block Pattern Background -->
  <rect x="50" y="50" width="80" height="80" rx="12" fill="#4DCCE6" fill-opacity="0.1" transform="rotate(-15 50 50)"/>
  <rect x="650" y="300" width="120" height="120" rx="18" fill="#C8F471" fill-opacity="0.1" transform="rotate(20 650 300)"/>
  <rect x="700" y="40" width="60" height="60" rx="10" fill="#F471B3" fill-opacity="0.1" transform="rotate(10 700 40)"/>
  
  <!-- Main Title Area -->
  <defs>
    <linearGradient id="titleGradient" x1="400" y1="150" x2="400" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DCCE6"/>
      <stop offset="1" stop-color="#3AA8C1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central "Pop" Action -->
  <circle cx="400" cy="235" r="150" fill="white" fill-opacity="0.5" filter="url(#glow)"/>
  
  <!-- Hero Blocks -->
  <!-- Blue Square -->
  <rect x="280" y="160" width="100" height="100" rx="16" fill="#4DCCE6" stroke="white" stroke-width="4"/>
  <path d="M310 190H350V230H310V190Z" fill="white" fill-opacity="0.3"/>
  
  <!-- Green Circle -->
  <circle cx="500" cy="210" r="55" fill="#C8F471" stroke="white" stroke-width="4"/>
  <circle cx="500" cy="210" r="25" fill="white" fill-opacity="0.3"/>
  
  <!-- Pink Star-ish Shape (simplified) -->
  <rect x="360" y="270" width="90" height="90" rx="14" fill="#F471B3" stroke="white" stroke-width="4" transform="rotate(45 405 315)"/>
  <path d="M405 295L415 315H435L420 325L425 345L405 333L385 345L390 325L375 315H395L405 295Z" fill="white" fill-opacity="0.3"/>

  <!-- Burst Effects -->
  <line x1="200" y1="100" x2="160" y2="60" stroke="#4DCCE6" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="380" x2="640" y2="420" stroke="#C8F471" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="350" x2="110" y2="390" stroke="#F471B3" stroke-width="8" stroke-linecap="round"/>

  <!-- Floating Text (Graphic Style) -->
  <text x="400" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="#212121" letter-spacing="-2">POP BLOCK</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="82" fill="#4DCCE6" letter-spacing="4">BLITZ</text>
  
  <!-- "Pop" Particles -->
  <circle cx="250" cy="280" r="8" fill="#4DCCE6"/>
  <circle cx="580" cy="150" r="6" fill="#C8F471"/>
  <circle cx="320" cy="380" r="10" fill="#F471B3"/>
  <circle cx="520" cy="330" r="5" fill="#F4A261"/>
</svg>